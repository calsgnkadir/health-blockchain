# Yerelde gormek icin gelistirme/demo modu (asil compose'a dokunmaz).
# Production modu secret ister + IP-allowlist localhost'u bloklar.
services:
  vip-health-vault:
    environment:
      ENVIRONMENT: development
      VHV_DEMO_MODE: "true"
      VIP_IP_ALLOWLIST_ENABLED: "false"
      VHV_ALLOW_GENERATED_KEY: "true"
      VHV_BIND_HOST: "0.0.0.0"
